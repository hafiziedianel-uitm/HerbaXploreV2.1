<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="uitm-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="uitm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="uitm-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- UiTM Crest Shield Background -->
  <g transform="translate(10, 10)">
    <!-- Base Shield -->
    <path d="M 50 0 L 90 0 C 95 0 100 5 100 10 L 100 55 C 100 80 75 95 50 100 C 25 95 0 80 0 55 L 0 10 C 0 5 5 0 10 0 Z" fill="url(#uitm-purple)" filter="url(#shadow)" />
    <!-- Gold Border Ring -->
    <path d="M 50 3 L 87 3 C 90 3 94 7 94 11 L 94 53 C 94 75 72 89 50 94 C 28 89 6 75 6 53 L 6 11 C 6 7 10 3 13 3 Z" fill="none" stroke="url(#uitm-gold)" stroke-width="2.5" />
    
    <!-- Top Crown / Book Motif (Yellow Gold) -->
    <path d="M 30 20 L 50 12 L 70 20 L 65 32 L 50 26 L 35 32 Z" fill="url(#uitm-gold)" />
    
    <!-- Solar Gear / Globe lines -->
    <circle cx="50" cy="50" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />
    <path d="M 36 50 L 64 50 M 50 36 L 50 64" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    
    <!-- Red Accent Ribbon at Base -->
    <path d="M 20 68 C 35 76 65 76 80 68 L 76 78 C 60 86 40 86 24 78 Z" fill="url(#uitm-red)" />

    <!-- "UiTM" Text within Shield -->
    <text x="50" y="60" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">UiTM</text>
  </g>

  <!-- Typography: UNIVERSITI TEKNOLOGI MARA -->
  <g transform="translate(125, 25)">
    <!-- Primary Acronym -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#1e1b4b" letter-spacing="0.5">UiTM</text>

    <!-- Full Official Name -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#1e293b" letter-spacing="1.2">UNIVERSITI TEKNOLOGI MARA</text>

    <!-- Subtitle / Faculty -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#047857" letter-spacing="1.5">FAKULTI FARMASI • FACULTY OF PHARMACY</text>
  </g>
</svg>
