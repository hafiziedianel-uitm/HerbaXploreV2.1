<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <style>
    .chem-line {
      stroke: #1c1917; /* stone-900 */
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .chem-double-line-1 {
      stroke: #1c1917;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .chem-bold-wedge {
      fill: #1c1917;
      stroke: #1c1917;
      stroke-width: 1;
    }
    .chem-dash-wedge {
      stroke: #1c1917;
      stroke-width: 2.2;
      stroke-dasharray: 2 3;
      fill: none;
    }
    .chem-text {
      fill: #1c1917; /* stone-900 */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .chem-title {
      fill: #06b6d4; /* cyan-500 */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: bold;
    }
    .chem-subtitle {
      fill: #78716c; /* stone-500 */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
    }
    @media (prefers-color-scheme: dark) {
      .chem-line, .chem-double-line-1, .chem-text {
        stroke: #f5f5f4; /* stone-100 */
      }
      .chem-bold-wedge {
        fill: #f5f5f4;
        stroke: #f5f5f4;
      }
      .chem-dash-wedge {
        stroke: #f5f5f4;
      }
      .chem-text, .chem-text-label {
        fill: #e7e5e4; /* stone-200 */
        stroke: none;
      }
      .chem-line {
        fill: none;
      }
      .chem-subtitle {
        fill: #a8a29e; /* stone-400 */
      }
    }
  </style>

  <!-- Background indicator or clean borders -->
  <rect x="0" y="0" width="100%" height="100%" fill="transparent" />

  <!-- Applet Labels & Annotations -->
  <text x="30" y="40" class="chem-title">Rutin (Quercetin-3-O-rutinoside)</text>
  <text x="30" y="60" class="chem-subtitle">Flavonol Glycoside • C₂₇H₃₀O₁₆</text>

  <!-- QUERCETIN CORE (Left side) -->
  <g id="quercetin-core">
    <!-- Ring A (Benzene on the far left) -->
    <!-- Vertices: A1(70, 200), A2(110, 175), A3(150, 200), A4(150, 250), A5(110, 275), A6(70, 250) -->
    <line x1="70" y1="200" x2="110" y2="175" class="chem-line" />
    <line x1="110" y1="175" x2="150" y2="200" class="chem-line" />
    <!-- double bond C=C inside ring A -->
    <line x1="106" y1="184" x2="142" y2="206" class="chem-line" />
    
    <line x1="150" y1="200" x2="150" y2="250" class="chem-line" />
    
    <line x1="150" y1="250" x2="110" y2="275" class="chem-line" />
    <!-- double bond inside A -->
    <line x1="142" y1="244" x2="110" y2="264" class="chem-line" />

    <line x1="110" y1="275" x2="70" y2="250" class="chem-line" />
    <line x1="70" y1="250" x2="70" y2="200" class="chem-line" />
    <!-- double bond inside A -->
    <line x1="78" y1="244" x2="78" y2="206" class="chem-line" />

    <!-- OH at C7 (extreme left) -->
    <line x1="70" y1="200" x2="45" y2="185" class="chem-line" />
    <text x="35" y="180" class="chem-text">HO</text>

    <!-- OH at C5 (bottom of A) -->
    <line x1="110" y1="275" x2="110" y2="300" class="chem-line" />
    <text x="110" y="312" class="chem-text">OH</text>

    <!-- Ring C (Pyranone in the middle) -->
    <!-- Vertices: A3(150, 200), A4(150, 250), C3(190, 275), C4(230, 250), C5(230, 200), C6_O(190, 175) -->
    <!-- We place an Oxygen atom at (190, 175) -> let's make bonds to it -->
    <line x1="150" y1="200" x2="175" y2="185" class="chem-line" />
    <text x="190" y="180" class="chem-text">O</text>
    <line x1="205" y1="185" x2="230" y2="200" class="chem-line" />

    <!-- Bond from A4(150, 250) to C3(190, 275) with C=O -->
    <line x1="150" y1="250" x2="190" y2="275" class="chem-line" />
    <line x1="190" y1="275" x2="190" y2="305" class="chem-line" /> <!-- C=O carbonyl bond 1 -->
    <line x1="195" y1="275" x2="195" y2="305" class="chem-line" /> <!-- C=O carbonyl bond 2 -->
    <text x="192" y="318" class="chem-text">O</text>

    <!-- Bond C3(190, 275) to C4(230, 250) -->
    <line x1="190" y1="275" x2="230" y2="250" class="chem-line" />
    <!-- C4-C5 has double bond in flavonols, but here at C3 is the O-sugar, double bond is between C2-C3 -->
    <line x1="230" y1="250" x2="230" y2="200" class="chem-line" stroke-width="3" /> <!-- Bold to represent double bond C2=C3 -->
    <line x1="222" y1="244" x2="222" y2="206" class="chem-line" />

    <!-- O-Glycoside Linkage at C3 (C250) -->
    <line x1="230" y1="250" x2="258" y2="266" class="chem-line" />
    <text x="268" y="272" class="chem-text">O</text>

    <!-- Ring B (Catechol) connected to C5(230, 200) -->
    <!-- Vertices: C5(230, 200) to B1(270, 175) -->
    <line x1="230" y1="200" x2="270" y2="175" class="chem-line" />

    <!-- Ring B vertices: B1(270, 175), B2(310, 200), B3(350, 175), B4(350, 125), B5(310, 100), B6(270, 125) -->
    <line x1="270" y1="175" x2="310" y2="200" class="chem-line" />
    <line x1="272" y1="164" x2="304" y2="184" class="chem-line" />

    <line x1="310" y1="200" x2="350" y2="175" class="chem-line" />

    <line x1="350" y1="175" x2="350" y2="125" class="chem-line" />
    <!-- double bond -->
    <line x1="342" y1="168" x2="342" y2="132" class="chem-line" />

    <line x1="350" y1="125" x2="310" y2="100" class="chem-line" />
    <line x1="310" y1="100" x2="270" y2="125" class="chem-line" />
    <!-- double bond -->
    <line x1="308" y1="111" x2="278" y2="130" class="chem-line" />

    <line x1="270" y1="125" x2="270" y2="175" class="chem-line" />

    <!-- OH at B3 (C3') -->
    <line x1="310" y1="100" x2="310" y2="75" class="chem-line" />
    <text x="310" y="65" class="chem-text">OH</text>

    <!-- OH at B4 (C4') -->
    <line x1="350" y1="125" x2="375" y2="110" class="chem-line" />
    <text x="390" y="105" class="chem-text">OH</text>

    <!-- OH at B5 (C3-side) -->
    <line x1="350" y1="175" x2="375" y2="190" class="chem-line" />
    <text x="390" y="195" class="chem-text">OH</text>
  </g>

  <!-- GLUCOSE MOIETY (Middle sugar) -->
  <g id="glucose-sugar">
    <!-- Oxygen at (268, 272) connects to C1 of Glucose (Glc-C1) at (305, 290) -->
    <line x1="278" y1="275" x2="305" y2="290" class="chem-line" />

    <!-- Glucose ring vertices: Glc-C1(305, 290), Glc-C2(305, 340), Glc-C3(345, 365), Glc-C4(385, 340), Glc-C5(385, 290), Glc-O(345, 265) -->
    <line x1="305" y1="290" x2="305" y2="340" class="chem-line" />
    <line x1="305" y1="340" x2="345" y2="365" class="chem-line" />
    <line x1="345" y1="365" x2="385" y2="340" class="chem-line" />
    <line x1="385" y1="340" x2="385" y2="290" class="chem-line" />
    
    <!-- Glc-C5 to Glc-O and Glc-O to Glc-C1 -->
    <line x1="385" y1="290" x2="360" y2="275" class="chem-line" />
    <text x="348" y="270" class="chem-text">O</text>
    <line x1="334" y1="274" x2="305" y2="290" class="chem-line" />

    <!-- Substituents on Glucose -->
    <!-- OH on C2: wedge down or dash -->
    <line x1="305" y1="340" x2="280" y2="355" class="chem-line" />
    <text x="268" y="362" class="chem-text">HO</text>

    <!-- OH on C3: wedge up -->
    <line x1="345" y1="365" x2="345" y2="395" class="chem-line" />
    <text x="345" y="408" class="chem-text">OH</text>

    <!-- OH on C4: wedge down -->
    <line x1="385" y1="340" x2="410" y2="355" class="chem-line" />
    <text x="424" y="362" class="chem-text">OH</text>

    <!-- CH2-O- linkage at C5 (385, 290) to Rhamnose -->
    <!-- Glc-C6 is at (425, 265) -->
    <line x1="385" y1="290" x2="425" y2="265" class="chem-line" />
    <!-- Oxygen linker to Rhamnose -->
    <line x1="425" y1="265" x2="450" y2="280" class="chem-line" />
    <text x="460" y="286" class="chem-text">O</text>
  </g>

  <!-- RHAMNOSE MOIETY (Right-hand sugar) -->
  <g id="rhamnose-sugar">
    <!-- Oxygen at (460, 286) connects to Rha-C1 at (495, 270) -->
    <line x1="470" y1="282" x2="495" y2="270" class="chem-line" />

    <!-- Rhamnose ring vertices: Rha-C1(495, 270), Rha-C2(535, 290), Rha-C3(575, 270), Rha-C4(575, 220), Rha-C5(535, 200), Rha-O(495, 220) -->
    <line x1="495" y1="270" x2="535" y2="290" class="chem-line" />
    <line x1="535" y1="290" x2="575" y2="270" class="chem-line" />
    <line x1="575" y1="270" x2="575" y2="220" class="chem-line" />
    
    <!-- Rha-C5 to Rha-O and Rha-O to Rha-C1 -->
    <line x1="575" y1="220" x2="535" y2="200" class="chem-line" />
    <line x1="535" y1="200" x2="510" y2="210" class="chem-line" />
    <text x="498" y="218" class="chem-text">O</text>
    <line x1="495" y1="228" x2="495" y2="270" class="chem-line" />

    <!-- Substituents on Rhamnose -->
    <!-- OH on C2 -->
    <line x1="535" y1="290" x2="535" y2="318" class="chem-line" />
    <text x="535" y="330" class="chem-text">OH</text>

    <!-- OH on C3 -->
    <line x1="575" y1="270" x2="602" y2="285" class="chem-line" />
    <text x="614" y="292" class="chem-text">OH</text>

    <!-- OH on C4 -->
    <line x1="575" y1="220" x2="602" y2="205" class="chem-line" />
    <text x="616" y="196" class="chem-text">OH</text>

    <!-- Methyl group (C6) on C5 (535, 200) -->
    <!-- Rhamnose is 6-deoxy sugar, so there's a CH3 instead of CH2OH -->
    <line x1="535" y1="200" x2="520" y2="170" class="chem-line" />
    <text x="512" y="156" class="chem-text">CH₃</text>
  </g>

  <!-- Labels indicating components -->
  <g opacity="0.6">
    <path d="M 120 330 L 120 350 L 160 350" stroke="#8c8a82" stroke-width="1.2" fill="none" class="chem-dash-wedge" />
    <text x="195" y="352" class="chem-subtitle" style="font-size: 10px; font-weight: bold; text-anchor: start;">Quercetin Aglycone</text>

    <path d="M 330 395 L 310 395" stroke="#8c8a82" stroke-width="1.2" fill="none" class="chem-dash-wedge" />
    <text x="300" y="395" class="chem-subtitle" style="font-size: 10px; font-weight: bold; text-anchor: end;">β-D-Glucose</text>

    <path d="M 575 320 L 590 320" stroke="#8c8a82" stroke-width="1.2" fill="none" class="chem-dash-wedge" />
    <text x="600" y="320" class="chem-subtitle" style="font-size: 10px; font-weight: bold; text-anchor: start;">α-L-Rhamnose</text>

    <text x="424" y="246" class="chem-subtitle" style="font-size: 10px; font-weight: bold; text-anchor: middle; fill: #10b981;">α-1,6 linkage</text>
  </g>
</svg>
