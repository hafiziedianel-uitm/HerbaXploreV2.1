<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <style>
    .chem-line {
      stroke: #1c1917; /* stone-900 */
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .chem-double-line-1 {
      stroke: #1c1917;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .chem-bold-wedge {
      fill: #1c1917;
      stroke: #1c1917;
      stroke-width: 1;
    }
    .chem-dash-wedge {
      stroke: #1c1917;
      stroke-width: 2.2;
      stroke-dasharray: 2 3;
      fill: none;
    }
    .chem-text {
      fill: #1c1917; /* stone-900 */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .chem-title {
      fill: #06b6d4; /* cyan-500 or emerald */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: bold;
    }
    .chem-subtitle {
      fill: #78716c; /* stone-500 */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 11px;
    }
    @media (prefers-color-scheme: dark) {
      .chem-line, .chem-double-line-1, .chem-text {
        stroke: #f5f5f4; /* stone-100 */
      }
      .chem-bold-wedge {
        fill: #f5f5f4;
        stroke: #f5f5f4;
      }
      .chem-dash-wedge {
        stroke: #f5f5f4;
      }
      .chem-text {
        fill: #e7e5e4; /* stone-200 */
        stroke: none;
      }
      .chem-subtitle {
        fill: #a8a29e; /* stone-400 */
      }
    }
  </style>

  <!-- Background indicator or clean borders -->
  <rect x="0" y="0" width="100%" height="100%" fill="transparent" />

  <!-- Applet Labels & Annotations -->
  <text x="30" y="40" class="chem-title">Arabic Acid Complex (Arabin / Arabic Acid Salts)</text>
  <text x="30" y="60" class="chem-subtitle">Acidic Polysaccharide Subunit • Highly Branched (Galactose, Arabinose, Glucuronic Acid, Rhamnose)</text>

  <!-- D-GALACTOSE UNIT (Center Pyranose Ring) -->
  <g id="galactose-unit">
    <!-- Ring vertices for a Pyranose ring: Gal1(260,200), Gal2(320,170), Gal3(380,200), Gal4(380,260), Gal5(320,290), Gal6(260,260) -->
    <!-- Oxygen at Gal1(260,200) replaced back to 260,200 node with a text "O" slightly offset -->
    <line x1="275" y1="192" x2="320" y2="170" class="chem-line" />
    <line x1="320" y1="170" x2="380" y2="200" class="chem-line" />
    <line x1="380" y1="200" x2="380" y2="260" class="chem-line" />
    <line x1="380" y1="260" x2="320" y2="290" class="chem-line" />
    <line x1="320" y1="290" x2="260" y2="260" class="chem-line" />
    <line x1="260" y1="260" x2="260" y2="215" class="chem-line" />
    
    <!-- Ring Oxygen -->
    <text x="260" y="200" class="chem-text">O</text>

    <!-- Hydroxyls & glycosidic bounds at Galactose C-positions -->
    <!-- C2(320,170) -> HO -->
    <line x1="320" y1="170" x2="320" y2="140" class="chem-line" />
    <text x="320" y="130" class="chem-text">OH</text>

    <!-- C3(380,200) -> OH -->
    <line x1="380" y1="200" x2="410" y2="185" class="chem-line" />
    <text x="425" y="180" class="chem-text">OH</text>

    <!-- C4(380,260) -> Glycosidic linkage to D-Glucuronic Acid -->
    <line x1="380" y1="260" x2="415" y2="275" class="chem-line" />
    <text x="425" y="280" class="chem-text">O</text>
    <!-- Glycosidic bridge continues to Glucuronic Acid molecule -->
    <line x1="435" y1="280" x2="470" y2="260" class="chem-line" />

    <!-- C5(320,290) -> CH2OH -->
    <line x1="320" y1="290" x2="320" y2="320" class="chem-line" />
    <line x1="320" y1="320" x2="295" y2="335" class="chem-line" />
    <text x="270" y="340" class="chem-text">HO</text>

    <!-- C1(260,260) -> Glycosidic linkage to Arabinose Unit -->
    <line x1="260" y1="260" x2="225" y2="275" class="chem-line" />
    <text x="215" y="280" class="chem-text">O</text>
    <line x1="205" y1="280" x2="170" y2="260" class="chem-line" />
  </g>

  <!-- D-GLUCURONIC ACID UNIT (Right Pyranose Ring) -->
  <g id="glucuronic-acid-unit">
    <!-- Ring vertices: Glu1(470,260), Glu2(530,230), Glu3(590,260), Glu4(590,320), Glu5(530,350), Glu6(470,320) -->
    <line x1="485" y1="252" x2="530" y2="230" class="chem-line" />
    <line x1="530" y1="230" x2="590" y2="260" class="chem-line" />
    <line x1="590" y1="260" x2="590" y2="320" class="chem-line" />
    <line x1="590" y1="320" x2="530" y2="350" class="chem-line" />
    <line x1="530" y1="350" x2="470" y2="320" class="chem-line" />
    <line x1="470" y1="320" x2="470" y2="275" class="chem-line" />

    <!-- Ring Oxygen -->
    <text x="470" y="260" class="chem-text">O</text>

    <!-- C2(530,230) -> OH -->
    <line x1="530" y1="230" x2="530" y2="200" class="chem-line" />
    <text x="530" y="190" class="chem-text">OH</text>

    <!-- C3(590,260) -> OH -->
    <line x1="590" y1="260" x2="620" y2="245" class="chem-line" />
    <text x="635" y="240" class="chem-text">OH</text>

    <!-- C4(590,320) -> OH -->
    <line x1="590" y1="320" x2="620" y2="335" class="chem-line" />
    <text x="635" y="340" class="chem-text">OH</text>

    <!-- C5(530,350) -> COOH (Carboxylic acid group giving the Acid character in Arabic Acid) -->
    <line x1="530" y1="350" x2="530" y2="385" class="chem-line" />
    <text x="530" y="400" class="chem-text">COOH</text>

    <!-- C1(470,320) -> linked to next galactose (represented with wavy line/O for polymers) -->
    <line x1="470" y1="320" x2="445" y2="335" class="chem-line" />
    <text x="435" y="340" class="chem-text">O</text>
    <!-- Polymer tail indicator -->
    <path d="M 425,340 Q 420,335 415,340 T 405,340" class="chem-dash-wedge" />
  </g>

  <!-- L-ARABINOSE UNIT (Left Furanose Ring) -->
  <g id="arabinose-unit">
    <!-- Furanose 5-membered ring: Ara1(170,260) as carbon, AraO(140,210) as Oxygen, Ara2(110,230), Ara3(110,290), Ara4(170,310) -->
    <line x1="170" y1="260" x2="150" y2="225" class="chem-line" />
    <line x1="130" y1="225" x2="110" y2="245" class="chem-line" />
    <line x1="110" y1="245" x2="110" y2="290" class="chem-line" />
    <line x1="110" y1="290" x2="170" y2="310" class="chem-line" />
    <line x1="170" y1="310" x2="170" y2="260" class="chem-line" />

    <!-- Ring Oxygen at apex -->
    <text x="140" y="215" class="chem-text">O</text>

    <!-- Ara3(110,290) -> OH -->
    <line x1="110" y1="290" x2="80" y2="305" class="chem-line" />
    <text x="65" y="310" class="chem-text">OH</text>

    <!-- Ara2(110,245) -> OH -->
    <line x1="110" y1="245" x2="80" y2="230" class="chem-line" />
    <text x="65" y="225" class="chem-text">HO</text>

    <!-- Ara4(170,310) -> HO-CH2- Group -->
    <line x1="170" y1="310" x2="200" y2="335" class="chem-line" />
    <text x="215" y="345" class="chem-text">OH</text>
  </g>

  <!-- Salt Form Highlights (Arabic acid typically occurs as Calcium or Magnesium sales) -->
  <g id="salt-interactions">
    <!-- Floating Ca2+ ion and coordinate lines to show salt complexes -->
    <circle cx="530" cy="110" r="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="530" y="110" font-family="'Inter', sans-serif" font-size="11px" font-weight="bold" fill="#10b981" text-anchor="middle" dominant-baseline="central">Ca²⁺</text>

    <path d="M 530,128 L 530,175" stroke="#10b981" stroke-width="1.2" stroke-dasharray="2 3" fill="none" />
    <path d="M 515,110 L 440,165" stroke="#10b981" stroke-width="1.2" stroke-dasharray="2 3" fill="none" />

    <text x="530" y="85" font-family="'Inter', sans-serif" font-size="10px" font-weight="600" fill="#10b981" text-anchor="middle" class="chem-text">Mineral counter-ion complex</text>
  </g>

  <!-- Connective polymer brackets to demonstrate macro nature -->
  <path d="M 50,150 L 30,150 L 30,360 L 50,360" stroke="#78716c" stroke-width="1.5" fill="none" />
  <path d="M 640,150 L 660,150 L 660,360 L 640,360" stroke="#78716c" stroke-width="1.5" fill="none" />
  <text x="670" y="255" font-family="'Inter', sans-serif" font-size="16px" font-weight="bold" fill="#78716c" dominant-baseline="central">n</text>
</svg>
